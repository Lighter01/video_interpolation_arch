input_path: raw_data/tmp_test/Dora.mp4
output_path: outputs/inference/baselines/blend_dora_2x.mp4
model:
  model_name: baseline_blend
  baseline_name: blend
limit_pairs: null
output_fps_multiplier: 2.0

# FFmpeg/PyAV encoder name.
# Recommended CPU option for baselines: libx264
# GPU option if available: h264_nvenc
codec: libx264

# Optional. If null/missing, infer from output_path extension.
# Examples: mp4, matroska, mov, webm
container: null

# Recommended for normal MP4 playback compatibility.
pix_fmt: yuv420p

# NumPy frame format sent to PyAV. Allowed: rgb24, bgr24.
frame_format: rgb24

# Per-codec options make GPU/CPU switching possible without rewriting common settings.
encoder_options_by_codec:
  h264_nvenc:
    preset: p3
    rc: vbr
    cq: "23"
    bf: "0"
  hevc_nvenc:
    preset: p3
    rc: vbr
    cq: "26"
    bf: "0"
  libx264:
    preset: veryfast
    crf: "22"
    bf: "0"
  libx265:
    preset: veryfast
    crf: "28"
    bf: "0"

# Passed directly to PyAV/FFmpeg after built-in and per-codec defaults.
encoder_options: {}
mlflow:
  enabled: true
  experiment_name: stage1-baseline-inference
  run_name: baseline_blend_2x
  tags:
    stage: stage1
    workflow: baseline_video_inference

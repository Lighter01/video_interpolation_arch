input_path: raw_data/tmp_test/Dora.mp4
output_path: outputs/inference/ema_vfi_small/dora_2x.mp4
model:
  model_name: ema_vfi_small
  repo_name: EMA-VFI
  checkpoint_path: EMA-VFI/ours_small_t.pkl
  inference_checkpoint_path: EMA-VFI/ours_small_t.pkl
  training_checkpoint_path: EMA-VFI/ours_small.pkl
  supported_modes:
    - fixed_2x
    - arbitrary_nx
  default_interpolation_factor: 2
  min_interpolation_factor: 2
  max_interpolation_factor: 8
  device: cuda
  tta: false
  fast_tta: false
  divisor: 32
  strict_checkpoint: true
limit_pairs: null
interpolation_mode: fixed_2x
interpolation_factor: 2
execution_mode: batched
inference_batch_size: null
output_fps_multiplier: 2.0

# FFmpeg/PyAV encoder name.
# Recommended fast NVIDIA GPU option: h264_nvenc
# CPU fallback: libx264
codec: h264_nvenc

# Optional. If null/missing, infer from output_path extension.
# Examples: mp4, matroska, mov, webm
container: null

# Recommended for normal MP4 playback compatibility.
pix_fmt: yuv420p

# NumPy frame format sent to PyAV. Allowed: rgb24, bgr24.
frame_format: rgb24

# Per-codec options make GPU/CPU switching possible without rewriting common settings.
encoder_options_by_codec:
  h264_nvenc:
    preset: p3
    rc: vbr
    cq: "23"
    bf: "0"
  hevc_nvenc:
    preset: p3
    rc: vbr
    cq: "26"
    bf: "0"
  libx264:
    preset: veryfast
    crf: "22"
    bf: "0"
  libx265:
    preset: veryfast
    crf: "28"
    bf: "0"

# Passed directly to PyAV/FFmpeg after built-in and per-codec defaults.
encoder_options: {}
mlflow:
  enabled: true
  experiment_name: stage1-ema-inference
  run_name: ema_vfi_small_2x
  tags:
    stage: stage1
    workflow: ema_video_inference

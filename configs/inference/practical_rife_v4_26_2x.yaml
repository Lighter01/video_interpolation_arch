input_path: raw_data/tmp_test/Dora.mp4
output_path: outputs/inference/practical_rife_v4_26/dora_2x.mp4
model:
  model_name: practical_rife_v4_26
  repo_name: Practical-RIFE
  checkpoint_path: Practical-RIFE/RIFEv4.26/train_log
  supported_modes:
    - fixed_2x
    - arbitrary_nx
  default_interpolation_factor: 2
  min_interpolation_factor: 2
  max_interpolation_factor: 8
  device: cuda
  timestep: 0.5
  scale: 1.0
  divisor: 128
  strict_checkpoint: false
limit_pairs: null
interpolation_mode: fixed_2x
interpolation_factor: 2
output_fps_multiplier: 2.0

# FFmpeg/PyAV encoder name.
# Recommended fast NVIDIA GPU option: h264_nvenc
# CPU fallback: libx264
codec: h264_nvenc

# Optional. If null/missing, infer from output_path extension.
# Examples: mp4, matroska, mov, webm
container: null

# Recommended for normal MP4 playback compatibility.
pix_fmt: yuv420p

# NumPy frame format sent to PyAV. Allowed: rgb24, bgr24.
frame_format: rgb24

# Per-codec options make GPU/CPU switching possible without rewriting common settings.
encoder_options_by_codec:
  h264_nvenc:
    preset: p3
    rc: vbr
    cq: "23"
    bf: "0"
  hevc_nvenc:
    preset: p3
    rc: vbr
    cq: "26"
    bf: "0"
  libx264:
    preset: veryfast
    crf: "22"
    bf: "0"
  libx265:
    preset: veryfast
    crf: "28"
    bf: "0"

# Passed directly to PyAV/FFmpeg after built-in and per-codec defaults.
encoder_options: {}
mlflow:
  enabled: true
  experiment_name: stage1-rife-inference
  run_name: practical_rife_v4_26_2x
  tags:
    stage: stage1
    workflow: practical_rife_video_inference

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${MLFLOW_POSTGRES_USER:?Set MLFLOW_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:?Set MLFLOW_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${MLFLOW_POSTGRES_DB:?Set MLFLOW_POSTGRES_DB in .env}
    ports:
      - "${MLFLOW_POSTGRES_PORT:-5433}:5432"
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_POSTGRES_USER} -d ${MLFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - mlflow_minio_data:/data

  create-mlflow-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MLFLOW_ARTIFACT_BUCKET: ${MLFLOW_ARTIFACT_BUCKET:?Set MLFLOW_ARTIFACT_BUCKET in .env}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb -p local/$${MLFLOW_ARTIFACT_BUCKET} || true;
      mc anonymous set none local/$${MLFLOW_ARTIFACT_BUCKET};
      "

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MLFLOW_IMAGE_NAME:-vfi-mlflow:3.12.0}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      create-mlflow-bucket:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg://${MLFLOW_POSTGRES_USER}:${MLFLOW_POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_POSTGRES_DB}
      - --serve-artifacts
      - --artifacts-destination
      - s3://${MLFLOW_ARTIFACT_BUCKET}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"

volumes:
  mlflow_postgres_data:
  mlflow_minio_data:

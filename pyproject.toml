[project]
name = "video-interpolation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av>=15.0.0",
    "imageio>=2.37.0",
    "lpips>=0.1.4",
    "matplotlib>=3.10.9",
    "minio>=7.2.20",
    "mlflow>=3.0.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.13.0.92",
    "omegaconf>=2.3.0",
    "pandas>=2.3.0",
    "pillow>=12.2.0",
    "plotly>=6.7.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "scenedetect>=0.6.6",
    "scikit-image>=0.25.0",
    "sqlalchemy>=2.0.49",
    "tenacity>=9.1.4",
    "timm>=1.0.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "typer>=0.25.1",
    "webdataset>=1.0.2",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
